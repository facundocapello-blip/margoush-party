<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1a1433">
  <title>MARGOUSH 3D · El rescate de Margot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&family=Lilita+One&family=Shrikhand&family=Rye&display=swap">
  <link rel="stylesheet" href="css/game.css?v=dc095d7a55">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div id="hud-portrait"></div>
        <div>
          <div id="hud-name">DOUGE</div>
          <div id="hud-hearts"></div>
          <div id="hud-power" aria-label="Poder"><div id="hud-power-fill"></div><span id="hud-power-text">PODER</span></div>
        </div>
        <div id="hud-margot" data-mood="calm" aria-label="Margot"></div>
      </div>
      <div class="hud-center">
        <div id="hud-score">0</div>
        <div id="hud-mult"></div>
      </div>
      <div class="hud-right">
        <button id="btn-mute" class="icon-btn" aria-label="Silenciar">♪</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pausa">Ⅱ</button>
      </div>
    </div>
    <div id="boss-bar" class="hidden"><span>BIG CHAKY</span><div class="track"><div id="boss-fill"></div></div></div>
    <div id="banner" class="hidden"></div>
    <div id="border-wipe" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="curtain" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <div id="level-card" class="hidden"><small id="level-done"></small><b id="level-name"></b><span id="level-pts"></span><em id="level-next"></em></div>
    <div id="combo" class="hidden"><b id="combo-num">0</b><small>GOLPES</small></div>
    <div id="labels"></div>
    <div id="offscreen" aria-hidden="true"></div>
    <div id="flash"></div>

    <div id="touch" class="hidden">
      <div id="stick-zone" aria-hidden="true"></div>
      <div id="joystick"><div id="knob"></div></div>
      <div id="actions">
        <button class="act" id="act-attack" data-action="attack" aria-label="Golpe (mantené para el poder)"><span class="ico">👊</span><i class="ring"></i></button>
        <button class="act" id="act-jump" data-action="jump" aria-label="Salto"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 8h-4.5v8h-5v-8H5z"/></svg><small>SALTO</small></button>
        <button class="act" id="act-dodge" data-action="dodge" aria-label="Esquivar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3" /><path d="M3 12h16a3 3 0 1 1-3 3" /><path d="M3 16h7" /></svg><small>ESQUIVE</small></button>
      </div>
    </div>


    <!-- Pantallas -->
    <section id="screen-loading" class="screen">
      <h1 class="logo">MARGOUSH</h1>
      <div class="bar"><div id="load-fill"></div></div>
    </section>

    <section id="screen-menu" class="screen hidden">
      <div class="cover-bg" aria-hidden="true"></div>
      <div class="beam beam-l" aria-hidden="true"></div>
      <div class="beam beam-r" aria-hidden="true"></div>
      <div class="cover-main">
        <div class="cover-title">
          <h1 class="logo">MARGOUSH</h1>
        </div>
        <div class="menu-col" id="menu-buttons">
          <button id="btn-continue" class="big-btn alt hidden">▶ CONTINUAR<small id="continue-where"></small></button>
          <div class="cta-row">
            <button id="btn-play" class="big-btn">¡JUGAR!</button>
            <div id="lang-pick" class="lang-pick" role="group" aria-label="Idioma">
              <button data-lang="es" aria-label="Español"><i class="flag flag-ar" aria-hidden="true"></i><span class="lang-long">Español</span><span class="lang-short">ES</span></button>
              <button data-lang="fr" aria-label="Français"><i class="flag flag-fr" aria-hidden="true"></i><span class="lang-long">Français</span><span class="lang-short">FR</span></button>
            </div>
          </div>
        </div>
      </div>
      <aside id="cover-podium" class="podium" aria-label="Ranking">
        <h2 id="podium-title" class="podium-title">Podio de la semana</h2>
        <ol id="podium-list"></ol>
        <p id="podium-empty" class="podium-empty hidden">Todavía nadie en el podio. ¡El primer lugar es tuyo!</p>
        <button id="btn-ranking" class="podium-more">Ver ranking completo</button>
      </aside>
    </section>

    <section id="screen-select" class="screen hidden">
      <h2>Elegí tu héroe</h2>
      <div class="cards">
        <button class="card" id="pick-douge" data-hero="douge"><b class="card-shout">¡DIUUUSHBAG!</b><img src="assets/douge_idle.webp" alt="Douge"><span>DOUGE</span></button>
        <button class="card" id="pick-marine" data-hero="marine"><b class="card-shout">¡Messi Goku!</b><img src="assets/marine_idle.webp" alt="Marine"><span>MARINE</span></button>
      </div>
      <button id="btn-select-back" class="ghost-btn">← Volver</button>
    </section>

    <section id="screen-pause" class="screen hidden">
      <h2>Pausa</h2>
      <div id="pause-main" class="menu-col">
        <button id="btn-resume" class="big-btn">SEGUIR</button>
        <button id="btn-restart" class="ghost-btn">Reintentar este tramo</button>
        <button id="btn-home" class="ghost-btn">Salir al menú</button>
      </div>
      <div id="pause-confirm" class="menu-col hidden">
        <p id="pause-confirm-text" class="confirm-text"></p>
        <button id="btn-confirm-yes" class="big-btn alt">Sí</button>
        <button id="btn-confirm-no" class="ghost-btn">No, seguir jugando</button>
      </div>
    </section>

    <section id="screen-result" class="screen hidden"></section>
    <section id="screen-ranking" class="screen hidden"></section>
  </div>

  <script>
    // iPhone: sin zoom por doble toque ni por pellizco (Safari ignora user-scalable=no).
    // Si igual quedó con zoom, se vuelve al tamaño normal solo.
    (function () {
      var lastT = 0, skip = function (t) { return t && t.closest && t.closest('input,textarea,button,a,.card'); };
      document.addEventListener('touchend', function (e) {
        var now = e.timeStamp;
        if (now - lastT < 350 && !skip(e.target)) e.preventDefault();
        lastT = now;
      }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('dblclick', function (e) { if (!skip(e.target)) e.preventDefault(); }, { passive: false });
      var vv = window.visualViewport, meta = document.querySelector('meta[name=viewport]');
      if (vv && meta) vv.addEventListener('resize', function () {
        if (vv.scale > 1.01) { var c = meta.content; meta.content = c + ',minimum-scale=1'; setTimeout(function () { meta.content = c; }, 60); }
      });
    })();
  </script>
