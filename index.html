function burst(x,y,color){for(let i=0;i<12;i++){const a=rand()*TAU,s=70+rand()*110;game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.35+rand()*.45,color,size:2+rand()*3})}}
function scoreEvent(kind,t){const g=game;g.events.push({kind,t:Math.round(t)});if(kind==='hazard'){g.combo=0;g.boostUntil=0;g.misses++;g.score=Math.max(0,g.score-15)}else if(kind==='miss'){g.combo=0;g.boostUntil=0;g.misses++}else{g.combo++;g.catches++;g.maxCombo=Math.max(g.maxCombo,g.combo);const base=kind==='gold'?25+Math.min(g.combo,5)*3:10+Math.min(g.combo,5)*2;g.score+=base*(t<g.boostUntil?2:1);if(g.combo%5===0){g.boostUntil=t+4500;soundEffect('boost')}}}
function tick(now){requestAnimationFrame(tick);if(!game)game={running:false,ended:false,last:now,elapsed:0,basket:195,target:195,drops:[],particles:[],texts:[],combo:0};const g=game;const dt=Math.max(0,Math.min(.04,(now-g.last)/1000));g.last=now;if(g.running){g.elapsed=Math.min(30000,now-g.started);g.basket+=(g.target-g.basket)*Math.min(1,dt*19);const stage=g.elapsed<10000?0:g.elapsed<20000?1:2;if(stage!==g.stage){g.stage=stage;const badge=$('phaseBadge');badge.textContent=stage===1?txt().stage1:txt().stage2;badge.classList.remove('hide');setTimeout(()=>badge.classList.add('hide'),1600);soundEffect('phase')}g.nextSpawn-=dt;if(g.nextSpawn<=0){const add=(x,y)=>{const roll=rand(),haz=[.12,.15,.18][stage],gold=[.26,.32,.38][stage];g.drops.push({id:++g.id,x,y,vy:160+stage*44+rand()*44,kind:roll<haz?'hazard':roll<gold?'gold':'normal',phase:rand()*TAU})};const x=32+rand()*326;add(x,-38);if(stage===2&&rand()<.17){add(x<195?Math.min(357,x+110+rand()*90):Math.max(32,x-110-rand()*90),-60)}g.nextSpawn=[.77,.63,.53][stage]+rand()*.22}for(let i=g.drops.length-1;i>=0;i--){const d=g.drops[i];d.y+=d.vy*dt;const hit=d.y>466&&d.y<515&&Math.abs(d.x-g.basket)<49,lost=d.y>544;if(!hit&&!lost)continue;g.drops.splice(i,1);if(hit){scoreEvent(d.kind==='hazard'?'hazard':d.kind==='gold'?'gold':'catch',g.elapsed);burst(d.x,d.y,d.kind==='hazard'?'#ef8b9d':d.kind==='gold'?'#f5cb5e':'#72d9ce');soundEffect(d.kind==='hazard'?'hazard':d.kind==='gold'?'gold':'catch');g.texts.push({x:d.x,y:d.y,label:d.kind==='hazard'?'-15':'+ '+(d.kind==='gold'?'★':'✓'),life:1,color:d.kind==='hazard'?'#c26577':'#308f8c'})}else if(d.kind!=='hazard'){scoreEvent('miss',g.elapsed);g.texts.push({x:d.x,y:510,label:'¡UPS!',life:.7,color:'#c36579'})}}if(g.misses>=3||g.elapsed>=30000||g.events.length>=80){finishGame()}if(now-lastUi>90){lastUi=now;setText('points',g.score.toLocaleString());setText('time',Math.max(0,Math.ceil((30000-g.elapsed)/1000))+'s');setHtml('hearts',[0,1,2].map(i=>'<span class="'+(i<g.misses?'off':'')+'">♥</span>').join(' '));$('comboBadge').textContent='COMBO ×'+g.combo;$('comboBadge').classList.toggle('hide',g.combo<2);$('boostBadge').classList.toggle('hide',!(g.elapsed<g.boostUntil))}}for(let i=g.particles.length-1;i>=0;i--){const q=g.particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=130*dt;q.life-=dt;if(q.life<=0)g.particles.splice(i,1)}for(let i=g.texts.length-1;i>=0;i--){const q=g.texts[i];q.y-=40*dt;q.life-=dt;if(q.life<=0)g.texts.splice(i,1)}background(now);if(!g.running&&!g.ended){pacifier(124,248+Math.sin(now*.002)*9,1.5,false,Math.sin(now*.001)*.13);pacifier(276,208+Math.sin(now*.0017)*10,1.15,true,-.2);star(75,220,9,'#ffe6a0')}for(const d of g.drops){if(d.kind==='hazard')rattle(d.x,d.y,Math.sin(now*.003+d.phase)*.15);else{pacifier(d.x,d.y,1,d.kind==='gold',Math.sin(now*.003+d.phase)*.15);if(d.kind==='gold')star(d.x+28,d.y-22,5,'#fff0a2')}}basket(g.basket,now,g.combo);for(const q of g.particles){ctx.globalAlpha=Math.min(1,q.life*2);ellipse(q.x,q.y,q.size,q.size,q.color)}ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='900 21px system-ui';for(const q of g.texts){ctx.globalAlpha=Math.min(1,q.life*1.7);ctx.fillStyle=q.color;ctx.fillText(q.label,q.x,q.y)}ctx.globalAlpha=1}
const canvas=$('game');function aim(e){const r=canvas.getBoundingClientRect();if(!game||!game.running)return;game.target=Math.max(52,Math.min(338,(e.clientX-r.left)/r.width*W))}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);aim(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons>0)aim(e)});requestAnimationFrame(tick);
async function start(){const input=$('nick');if(input)nickname=input.value.trim().slice(0,20);if(nickname.length<2){input&&input.focus();return}persist();if(phase==='playing'||phase==='starting')return;phase='starting';$('play').disabled=true;try{if(!fxCtx)fxCtx=new (window.AudioContext||window.webkitAudioContext)();if(fxCtx.state==='suspended')fxCtx.resume()}catch{}playMusic();roundId=null;try{const response=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId,nickname}),signal:AbortSignal.timeout(4000)});if(response.ok){const data=await response.json();roundId=data.roundId}}catch{}game=newGame();phase='playing';$('overlay').classList.add('hide');$('phaseBadge').classList.add('hide');$('boostBadge').classList.add('hide');$('comboBadge').classList.add('hide')}
async function finishGame(){if(!game||game.ended)return;game.ended=true;game.running=false;phase='result';stopMusic();soundEffect('finish');const result={score:game.score,catches:game.catches,misses:game.misses,maxCombo:game.maxCombo,events:game.events.slice()},oldBest=Number(localStorage.getItem('margoush-party-best')||0);if(result.score>oldBest)localStorage.setItem('margoush-party-best',String(result.score));const records=JSON.parse(localStorage.getItem('margoush-party-scores')||'[]');records.push({playerId,nickname,score:result.score,at:new Date().toISOString()});localStorage.setItem('margoush-party-scores',JSON.stringify(records.slice(-250)));renderResult(result,oldBest);if(roundId){try{const response=await fetch('/api/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...result,playerId,roundId}),signal:AbortSignal.timeout(6000)});if(response.ok){setText('saveStatus',txt().save);refreshRanking();return}}catch{}}setText('saveStatus',txt().local);refreshRanking()}
let lastResult=null,lastOldBest=0;function renderResult(result=lastResult,oldBest=lastOldBest){if(!result)return;lastResult=result;lastOldBest=oldBest;const t=txt();setHtml('modal','<div class="tiny">✦ '+t.done+' ✦</div><div class="resultScore">'+result.score.toLocaleString()+'<small> pts</small></div>'+(result.score>oldBest?'<div class="newRecord">'+t.best+'</div>':'')+'<div class="resultMetrics"><span>'+t.caught+'<b>'+result.catches+'</b></span><span>'+t.bestCombo+'<b>×'+result.maxCombo+'</b></span></div><p class="status" id="saveStatus">'+t.local+'</p><button class="cta" id="again">'+t.again+' <span>↻</span></button><button class="share" id="share">'+t.share+' ↗</button>');$('again').onclick=()=>{phase='ready';renderIntro()};$('share').onclick=async()=>{const msg='MARGOUSH PARTY · '+t.title+': '+result.score+' pts. ¡Superame!';try{if(navigator.share)await navigator.share({title:'MARGOUSH PARTY',text:msg});else await navigator.clipboard.writeText(msg)}catch{}};$('overlay').classList.remove('hide')}
function weekStart(){const d=new Date(),day=(d.getUTCDay()+6)%7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day)}function localRank(){const rec=JSON.parse(localStorage.getItem('margoush-party-scores')||'[]').filter(x=>rankTab==='allTime'||new Date(x.at).getTime()>=weekStart());const map=new Map();for(const r of rec){const prev=map.get(r.playerId);if(!prev||prev.score<r.score)map.set(r.playerId,r)}return [...map.values()].sort((a,b)=>b.score-a.score).slice(0,50)}function renderRanking(){const t=txt(),rows=remote&&rankData?rankData[rankTab]||[]:localRank();const holder=$('ranking');holder.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent=t.empty;holder.appendChild(d)}else rows.slice(0,10).forEach((r,i)=>{const row=document.createElement('div');row.className='rankRow'+(r.playerId===playerId?' mine':'');const pos=document.createElement('span');pos.className='place';pos.textContent=i===0?'★':String(i+1).padStart(2,'0');const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=(r.nickname||'?')[0].toUpperCase();const name=document.createElement('span');name.className='rankName';name.textContent=r.nickname;const score=document.createElement('b');score.className='rankScore';score.textContent=Number(r.score).toLocaleString();row.append(pos,avatar,name,score);holder.appendChild(row)});setText('rankFoot',remote?t.rankFoot:t.offline)}async function refreshRanking(){try{const r=await fetch('/api/ranking',{signal:AbortSignal.timeout(4500),cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data.weekly)||!Array.isArray(data.allTime))throw Error();rankData=data;remote=true}catch{remote=false}renderRanking()}$('weeklyBtn').onclick=()=>{rankTab='weekly';$('weeklyBtn').classList.add('active');$('allBtn').classList.remove('active');renderRanking()};$('allBtn').onclick=()=>{rankTab='allTime';$('allBtn').classList.add('active');$('weeklyBtn').classList.remove('active');renderRanking()};$('refreshBtn').onclick=refreshRanking;document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();if(phase==='playing'&&game){game.pausedAt=performance.now()}}else if(phase==='playing'&&game){if(game.pausedAt){const pauseMs=performance.now()-game.pausedAt;game.started+=pauseMs;game.last=performance.now();delete game.pausedAt}if(sound){music.currentTime=Math.min(29.9,game.elapsed/1000);music.play().catch(()=>{})}}});persist();translate();refreshRanking();
})();</script></body></html>
